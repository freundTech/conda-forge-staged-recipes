context:
  version: "0.1.1"

package:
  name: cpptoml
  version: ${{ version }}

source:
  url: https://github.com/skystrife/cpptoml/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 23af72468cfd4040984d46a0dd2a609538579c78ddc429d6b8fd7a10a6e24403
  patches: 
    - 0001-g-11-requires-limits-header.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake<4
    - make

tests:
  - package_contents:
      include:
        - cpptoml.h
      files:
         - lib/cmake/cpptoml/cpptomlConfig.cmake
         - lib/cmake/cpptoml/cpptomlConfigVersion.cmake
         - lib/cmake/cpptoml/cpptomlTargets.cmake

  - requirements:
      build:
        - ${{ compiler('cxx') }}
    files:
      recipe:
        - cpptoml_test.cpp
    script:
      - $CXX $CXXFLAGS $LDFLAGS cpptoml_test.cpp -o cpptoml_test
      - ./cpptoml_test


about:
  homepage: https://facebook.github.io/watchman
  summary: 'Watches files and records, or triggers actions, when they change. '
  description: |
    Watchman exists to watch files and record when they actually change. It can also trigger actions (such as rebuilding assets) when matching files change.
  license: MIT
  license_file: LICENSE
  documentation: https://facebook.github.io/watchman/
  repository: https://github.com/facebook/watchman

extra:
  recipe-maintainers:
    - freundTech
