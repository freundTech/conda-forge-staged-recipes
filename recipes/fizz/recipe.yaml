context:
  version: "2026.06.01.00"

package:
  name: fizz
  version: ${{ version }}

source:
  url: https://github.com/facebookincubator/fizz/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c59640372e10c687c5ddd362f79ea47e24827bb5b491de75a1969e827f7b06d7

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake<4
    - ninja 
  host:
    - folly
    - fmt
    - openssl
    - glog
    - zstd
    - libsodium
    - gflags
    - zlib
    - libevent
    - liblzma-devel
  run:
    - folly
    - fmt
    - openssl
    - glog
    - zstd
    - libsodium
    - zlib

tests:
  - package_contents:
      include:
        - fizz/client/FizzClient.h
        - fizz/server/FizzServer.h
      files:
         - lib/cmake/fizz/fizz-config.cmake
         - lib/cmake/fizz/fizz-targets-release.cmake
         - lib/cmake/fizz/fizz-targets.cmake

  - requirements:
      build:
        - ${{ compiler('cxx') }}
        - cmake
        - pkgconfig
        - ninja
    files:
      recipe:
        - test/
    script:
      - $CXX $CXXFLAGS -std=c++20 $LDFLAGS test/fizz_test.cpp -lfizz -o fizz_test
      - ./fizz_test

about:
  homepage: https://github.com/facebookincubator/fizz
  summary: 'An implementation of the QUIC transport protocol.'
  description: |
    mvfst (Pronounced move fast) is a client and server implementation of IETF QUIC protocol in C++ by Facebook. QUIC is a UDP based reliable, multiplexed transport protocol that will become an internet standard. The goal of mvfst is to build a performant implementation of the QUIC transport protocol that applications could adapt for use cases on both the internet and the data-center. mvfst has been tested at scale on android, iOS apps, as well as servers and has several features to support large scale deployments.
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/facebook/mvfst

extra:
  recipe-maintainers:
    - freundTech
