context:
  version: "2026.06.01.00"

package:
  name: mvfst
  version: ${{ version }}

source:
  url: https://github.com/facebook/mvfst/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e722629b16cb60639f43c61d220ad8f3e08edb6d38b8e059e07e931061dd087d

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja 
  host:
    - libboost-devel
    - gtest
    - fizz
    - fmt
    - folly
    - gflags
    - glog
    - openssl
    - zlib
    - liblzma-devel
    - double-conversion
  run:
    - libboost
    - gtest
    - fizz
    - fmt
    - folly
    - gflags
    - glog
    - openssl
    - zlib
    - double-conversion


about:
  homepage: https://github.com/facebook/mvfst
  summary: 'An implementation of the QUIC transport protocol.'
  description: |
    mvfst (Pronounced move fast) is a client and server implementation of IETF QUIC protocol in C++ by Facebook. QUIC is a UDP based reliable, multiplexed transport protocol that will become an internet standard. The goal of mvfst is to build a performant implementation of the QUIC transport protocol that applications could adapt for use cases on both the internet and the data-center. mvfst has been tested at scale on android, iOS apps, as well as servers and has several features to support large scale deployments.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/facebook/mvfst

extra:
  recipe-maintainers:
    - freundTech
